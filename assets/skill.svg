<svg xmlns="http://www.w3.org/2000/svg" width="430" height="80" viewBox="0 0 430 80" role="img" aria-labelledby="title desc">
  <title id="title">Go, TypeScript and Python — hand-drawn coding stickers</title>
  <desc id="desc">Three playful, unevenly tilted hand-drawn cards with a Go gopher, TypeScript logo and Python symbol.</desc>
  <defs>
    <linearGradient id="go-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fcff"/>
      <stop offset="1" stop-color="#d8f4fb"/>
    </linearGradient>
    <linearGradient id="ts-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f6ff"/>
      <stop offset="1" stop-color="#e3ebff"/>
    </linearGradient>
    <linearGradient id="py-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#fff0c9"/>
    </linearGradient>
  </defs>

  <!-- Floating doodles, deliberately asymmetric -->
  <g fill="none" stroke="#242933" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 35 Q3 32 7 24 M14 41 Q7 43 5 49" stroke-width="2.2"/>
    <path d="M131 4 l5 -3 m-1 11 6 -2" stroke-width="2"/>
    <path d="M271 65 q7 5 12 0 q4 -6 9 -3" stroke-width="1.7"/>
    <path d="M409 31 q9 -1 13 5 m-10 4 9 4" stroke-width="2"/>
  </g>
  <path d="M148 58 l3.5 -8 3 8 8 3 -8 3 -3 8 -3.5 -8 -7.5 -3z" fill="#ffd445" stroke="#222933" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="285" cy="14" r="2.5" fill="#70c8f7"/>
  <circle cx="274" cy="22" r="1.8" fill="#242933"/>
  <path d="M395 7 l2 -5 m5 10 6 -3" stroke="#f2b828" stroke-width="2.8" stroke-linecap="round"/>

  <!-- GO card: left lean -->
  <g transform="translate(23 9) rotate(-7 53 30)">
    <path d="M8 7 Q19 3 100 6 Q111 7 110 17 L109 57 Q107 63 97 64 L11 63 Q3 62 4 51 L4 16 Q4 10 8 7Z" fill="#515966" opacity=".18" transform="translate(3 4)"/>
    <path d="M8 5 Q18 2 100 4 Q108 5 109 15 L108 54 Q108 61 97 61 L11 62 Q3 60 4 50 L3 15 Q4 8 8 5Z" fill="url(#go-paper)" stroke="#222933" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M11 12 l12 -4 m-11 10 7 -5" stroke="#6bb5c4" stroke-width="1.6" stroke-linecap="round"/>
    <!-- Gopher: round, goofy, dynamic -->
    <ellipse cx="54" cy="37" rx="22" ry="19" fill="#85d7e7" stroke="#222933" stroke-width="2.3"/>
    <circle cx="39" cy="21" r="5.7" fill="#85d7e7" stroke="#222933" stroke-width="2.1"/>
    <circle cx="68" cy="20" r="5.7" fill="#85d7e7" stroke="#222933" stroke-width="2.1"/>
    <path d="M33 43 Q28 47 25 42 M73 43 Q80 47 84 41" fill="none" stroke="#222933" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="44" cy="31" rx="10.7" ry="11.2" fill="white" stroke="#222933" stroke-width="2.2"/>
    <ellipse cx="65" cy="31" rx="10.7" ry="11.2" fill="white" stroke="#222933" stroke-width="2.2"/>
    <circle cx="47" cy="31" r="2.5" fill="#222933"/>
    <circle cx="62" cy="31" r="2.5" fill="#222933"/>
    <ellipse cx="55" cy="39.2" rx="3.6" ry="2.6" fill="#222933"/>
    <path d="M51.8 42 L58.2 42 L58.1 47 Q54.8 50 51.8 47Z" fill="white" stroke="#222933" stroke-width="1.5"/>
    <path d="M46 54 l-4 3 M64 54 l5 2" fill="none" stroke="#222933" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M91 19 l7 -4 m-5 9 9 -4" stroke="#59bed6" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- TS card, slightly higher and opposite lean -->
  <g transform="translate(163 2) rotate(6 52 31)">
    <path d="M7 7 Q17 3 100 5 Q108 7 108 17 L108 56 Q108 62 98 63 L10 63 Q4 60 4 52 L3 15 Q3 9 7 7Z" fill="#515966" opacity=".18" transform="translate(3 4)"/>
    <path d="M7 5 Q17 2 100 4 Q108 6 108 14 L107 54 Q107 62 98 62 L11 62 Q4 61 4 51 L3 16 Q3 8 7 5Z" fill="url(#ts-paper)" stroke="#222933" stroke-width="2.6" stroke-linejoin="round"/>
    <rect x="29" y="11" width="54" height="45" rx="7" fill="#237ad0" stroke="#222933" stroke-width="2"/>
    <path d="M37 15 l12 -2 M39 20 l7 -2" stroke="#90cfff" stroke-width="1.3" stroke-linecap="round"/>
    <text x="56" y="43" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="800" letter-spacing="-2" text-anchor="middle" fill="white">TS</text>
    <path d="M14 16 l7 -8 m-3 15 7 -7" stroke="#719ee4" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M89 45 l8 -7 m-5 13 8 -7" stroke="#719ee4" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Python card, lower and loosely tilted -->
  <g transform="translate(301 10) rotate(-6 52 30)">
    <path d="M8 7 Q17 4 100 5 Q110 9 109 18 L108 56 Q107 63 98 64 L10 62 Q4 60 4 53 L3 16 Q4 9 8 7Z" fill="#515966" opacity=".18" transform="translate(3 4)"/>
    <path d="M8 5 Q19 2 101 4 Q108 7 108 16 L108 54 Q106 62 96 62 L10 61 Q4 60 4 51 L3 16 Q4 9 8 5Z" fill="url(#py-paper)" stroke="#222933" stroke-width="2.6" stroke-linejoin="round"/>
    <!-- Stylized interlocking Python snakes -->
    <path d="M54 12 C39 12 34 16 34 24 L34 32 L55 32 Q62 32 62 39 L62 41 L73 41 Q79 41 79 33 L79 23 Q79 12 65 12Z" fill="#3276ac" stroke="#222933" stroke-width="2.0" stroke-linejoin="round"/>
    <path d="M57 53 C72 53 78 49 78 42 L78 34 L56 34 Q48 34 48 27 L48 25 L38 25 Q31 25 31 33 L31 43 Q31 53 45 53Z" fill="#ffd34d" stroke="#222933" stroke-width="2.0" stroke-linejoin="round"/>
    <circle cx="57.5" cy="20" r="2.5" fill="white"/>
    <circle cx="51.5" cy="45.5" r="2.5" fill="white"/>
    <path d="M12 45 l9 4 m-8 2 8 3" stroke="#e3b94e" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M88 14 l8 5 m-9 1 8 6" stroke="#e3b94e" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>